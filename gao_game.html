<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cooking Mama - Gao Game Edition</title>

    <!-- 💡 載入街機像素字型 Press Start 2P -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        /* 💡 載入本地 fonts 資料夾內的「縫合像素繁體-12px-比例.ttf」 */
        @font-face {
            font-family: 'StitchPixelFont';
            src: url('./fonts/縫合像素繁體-12px-比例.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Press Start 2P', 'StitchPixelFont', monospace;
        }
        body {
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Press Start 2P', 'StitchPixelFont', monospace;
        }
        #gameContainer {
            position: relative;
            width: 96vw;
            height: 72vw;
            max-width: 800px;
            max-height: 600px;
            background-color: #000;
            box-shadow: 0 0 35px rgba(0,0,0,0.95);
            overflow: hidden;
            touch-action: none;
        }
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
</div>

<script>
function initGame() {
    const canvas = document.getElementById('gameCanvas');
    const container = document.getElementById('gameContainer');

    if (!canvas) return;
    
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    const GAME_WIDTH = 800;
    const GAME_HEIGHT = 600;
    canvas.width = GAME_WIDTH;
    canvas.height = GAME_HEIGHT;

    let audioCtx = null;

    function loadRobustImage(baseName) {
        const img = new Image();
        const sources = [
            `images/${baseName}.jpg.jpg`,
            `images/${baseName}.jpg`,
            `./images/${baseName}.jpg`,
            `${baseName}.jpg.jpg`,
            `${baseName}.jpg`
        ];
        let srcIdx = 0;

        img.onload = () => { img.isReady = true; };
        img.onerror = () => {
            srcIdx++;
            if (srcIdx < sources.length) {
                img.src = sources[srcIdx];
            }
        };
        img.src = sources[0];
        return img;
    }

    const bgImg1 = loadRobustImage('bg_1');
    const bgImg2 = loadRobustImage('bg_2');
    const bgImg3 = loadRobustImage('bg_3');

    let currentBgImg = bgImg1;

    function initAudioContext() {
        try {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) audioCtx = new AudioContextClass();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        } catch(e) {}
    }

    window.addEventListener('message', (e) => {
        if (e.data === 'UNLOCK_AUDIO' || (e.data && e.data.action === 'UNLOCK_AUDIO')) {
            initAudioContext();
        }
    });

    window.addEventListener('pointerdown', initAudioContext, { passive: true });
    window.addEventListener('touchstart', initAudioContext, { passive: true });

    let score = 0;
    let lives = 3;
    const maxLives = 3;
    let gameStarted = false; 
    let isCountingDown = true; 
    let countdownStep = -1; 
    let countdownTimer = 0;
    let gameOver = false;
    let gameOverLockTime = 0;

    // 💡 成功切到的「普通番茄或黃金番茄」總計數器
    let validTomatoesSliced = 0;

    let comboCount = 0;
    const MAX_COMBO = 17;
    let isFever = false;
    let feverTimer = 0;
    
    // 固定 1.5 秒清場計時器
    let isCoolingDown = false;
    let cooldownTimer = 0;
    
    let screenShake = 0;
    let speedMultiplier = 1.0;

    let items = [];
    let slicedPieces = [];
    let explosions = [];
    let floatingTexts = [];
    let knifeSlash = null;

    let animTimer1 = null;
    let animTimer2 = null;
    let lastTime = Date.now();

    function playSound(type) {
        try {
            initAudioContext();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'slash') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(900, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.08);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'hit') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(350, now);
                osc.frequency.exponentialRampToValueAtTime(700, now + 0.1);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'heal' || type === 'fever') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523, now);
                osc.frequency.setValueAtTime(659, now + 0.08);
                osc.frequency.setValueAtTime(783, now + 0.16);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'explosion') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.linearRampToValueAtTime(30, now + 0.3);
                gain.gain.setValueAtTime(0.6, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'beep') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                gain.gain.setValueAtTime(0.8, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'beep_final') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(880, now);
                gain.gain.setValueAtTime(0.8, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        } catch(e) {}
    }

    function drawCleanBackground() {
        ctx.save();
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        if (screenShake > 0) {
            const rx = (Math.random() - 0.5) * screenShake * 2;
            const ry = (Math.random() - 0.5) * screenShake * 2;
            ctx.translate(rx, ry);
            screenShake *= 0.82;
            if (screenShake < 0.5) screenShake = 0;
        }

        if (currentBgImg && (currentBgImg.isReady || (currentBgImg.complete && currentBgImg.naturalWidth !== 0))) {
            ctx.drawImage(currentBgImg, 0, 0, GAME_WIDTH, GAME_HEIGHT);
        } else {
            ctx.fillStyle = '#1e1b2e';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
        }

        ctx.restore();
    }

    function drawPixelBox(x, y, w, h, bgColor, borderColor, shadowColor = '#000000', pixelSize = 4) {
        ctx.save();
        ctx.fillStyle = shadowColor;
        ctx.fillRect(x + pixelSize, y + pixelSize, w, h);
        ctx.fillStyle = bgColor;
        ctx.fillRect(x, y, w, h);
        ctx.fillStyle = borderColor;
        ctx.fillRect(x, y, w, pixelSize); 
        ctx.fillRect(x, y + h - pixelSize, w, pixelSize); 
        ctx.fillRect(x, y, pixelSize, h); 
        ctx.fillRect(x + w - pixelSize, y, pixelSize, h); 
        ctx.restore();
    }

    function drawPixelText(text, x, y, color = '#ffffff', fontSize = 16, align = 'center', useOnlyStitchFont = false) {
        ctx.save();
        if (useOnlyStitchFont) {
            ctx.font = `${fontSize}px "StitchPixelFont", monospace`;
        } else {
            ctx.font = `${fontSize}px "Press Start 2P", "StitchPixelFont", monospace`;
        }
        
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';

        ctx.fillStyle = '#000000';
        const offsets = [[-2,0], [2,0], [0,-2], [0,2], [-2,-2], [2,-2], [-2,2], [2,2]];
        for (let [ox, oy] of offsets) {
            ctx.fillText(text, x + ox, y + oy);
        }

        ctx.fillStyle = color;
        ctx.fillText(text, x, y);
        ctx.restore();
    }

    function drawPixelTomatoIcon(cx, cy, scale = 1.0, mainColor = '#d50000', highlightColor = '#ff8a80', stemColor = '#1b5e20') {
        ctx.save();
        ctx.translate(Math.round(cx), Math.round(cy));
        ctx.scale(scale, scale);

        ctx.fillStyle = stemColor;
        ctx.fillRect(-6, -22, 12, 6);
        ctx.fillRect(-3, -25, 6, 4);

        ctx.fillStyle = '#000000';
        ctx.fillRect(-21, -16, 42, 32);
        ctx.fillRect(-16, -21, 32, 42);

        ctx.fillStyle = mainColor;
        ctx.fillRect(-19, -14, 38, 28);
        ctx.fillRect(-14, -19, 28, 38);

        ctx.fillStyle = highlightColor;
        ctx.fillRect(-12, -12, 8, 8);
        ctx.restore();
    }

    class FloatingText {
        constructor(text, x, y, color, fontSize = 20) {
            this.text = text;
            this.x = x;
            this.y = y;
            this.color = color;
            this.fontSize = fontSize;
            this.opacity = 1.0;
        }
        update(delta) {
            this.y -= 118 * delta;
            this.opacity -= 1.3 * delta;
        }
        draw() {
            if (this.opacity <= 0) return;
            ctx.save();
            ctx.globalAlpha = Math.max(0, this.opacity);
            drawPixelText(this.text, this.x, this.y, this.color, this.fontSize, 'center');
            ctx.restore();
        }
    }

    class FoodItem {
        constructor(type) {
            this.type = type;
            this.x = GAME_WIDTH / 2 + (Math.random() * 320 - 160);
            this.y = GAME_HEIGHT + 40;

            const rawLevel = Math.floor(validTomatoesSliced / 10);
            const level = Math.min(14, rawLevel);

            const levelSpeedBoost = 1.0 + level * 0.05;

            // 💡 再加快 13%：水平位移速度提升至 644 px/s
            this.vx = (Math.random() - 0.5) * 644 * (isFever ? 1.0 : speedMultiplier) * levelSpeedBoost;
            
            let targetY = GAME_HEIGHT * (0.28 + Math.random() * 0.32);
            targetY = Math.max(130, targetY);

            // 💡 再加快 13%：重力加速度提升至 3288 px/s²（俐落絕倫的拋物線彈射感）
            this.gravity = 3288 * (isFever ? 1.0 : speedMultiplier) * levelSpeedBoost;
            const dist = GAME_HEIGHT + 40 - targetY;
            let initialVy = -Math.sqrt(2 * this.gravity * dist);

            if (isFever) {
                initialVy *= (1.15 + Math.random() * 0.25);
            }

            this.vy = initialVy;
            this.isSliced = false;
            this.glowTimer = 0;
            this.peakY = GAME_HEIGHT + 40;
        }

        update(delta) {
            this.x += this.vx * delta;
            this.y += this.vy * delta;
            this.vy += this.gravity * delta;
            this.glowTimer += 13.5 * delta;

            if (this.y < this.peakY) {
                this.peakY = this.y;
            }
        }

        draw() {
            if (this.isSliced) return;
            ctx.save();
            ctx.imageSmoothingEnabled = false;

            if (this.type.includes('tomato')) {
                if (this.type === 'golden_tomato') {
                    const pulse = Math.sin(this.glowTimer);
                    const haloRadius = 58 + pulse * 6;
                    const innerRadius = 36 + pulse * 3;

                    ctx.save();
                    const radGrad = ctx.createRadialGradient(this.x, this.y, 8, this.x, this.y, haloRadius);
                    radGrad.addColorStop(0, 'rgba(255, 245, 157, 0.98)');
                    radGrad.addColorStop(0.4, 'rgba(255, 215, 0, 0.75)');
                    radGrad.addColorStop(0.8, 'rgba(255, 160, 0, 0.35)');
                    radGrad.addColorStop(1, 'rgba(255, 143, 0, 0)');

                    ctx.fillStyle = radGrad;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, haloRadius, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = `rgba(255, 255, 255, ${0.65 + pulse * 0.2})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, innerRadius, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = '#ffe082';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, haloRadius - 3, 0, Math.PI * 2);
                    ctx.stroke();

                    ctx.restore();

                    drawPixelTomatoIcon(this.x, this.y, 1.7, '#e53935', '#fff59d', '#76ff03');
                } else if (this.type === 'rotten_tomato') {
                    ctx.save();
                    ctx.translate(Math.round(this.x), Math.round(this.y));
                    ctx.scale(1.7, 1.7);
                    ctx.fillStyle = '#33691e';
                    ctx.fillRect(-6, -22, 12, 6);
                    ctx.fillRect(-3, -25, 6, 4);
                    ctx.fillStyle = '#000000';
                    ctx.fillRect(-21, -16, 42, 32);
                    ctx.fillRect(-16, -21, 32, 42);
                    ctx.fillStyle = '#6a1b29';
                    ctx.fillRect(-19, -14, 38, 28);
                    ctx.fillRect(-14, -19, 28, 38);
                    ctx.fillStyle = '#2d0812';
                    ctx.fillRect(-14, 2, 28, 17);
                    ctx.fillStyle = '#000000';
                    ctx.fillRect(-10, 8, 20, 10);
                    ctx.fillStyle = '#a73a4b';
                    ctx.fillRect(-12, -12, 8, 8);
                    ctx.restore();
                } else {
                    drawPixelTomatoIcon(this.x, this.y, 1.7);
                }
            } else if (this.type === 'dumpling') {
                ctx.save();
                ctx.translate(Math.round(this.x), Math.round(this.y));
                ctx.scale(1.7, 1.7);
                ctx.fillStyle = '#000000';
                ctx.fillRect(-22, -8, 44, 20);
                ctx.fillRect(-18, -14, 36, 28);
                ctx.fillRect(-16, -18, 6, 6);
                ctx.fillRect(-6, -20, 6, 6);
                ctx.fillRect(4, -20, 6, 6);
                ctx.fillRect(12, -18, 6, 6);

                ctx.fillStyle = '#fffde7';
                ctx.fillRect(-20, -6, 40, 16);
                ctx.fillRect(-16, -12, 32, 22);

                ctx.fillStyle = '#fbc02d';
                ctx.fillRect(-16, 4, 32, 6);

                ctx.fillStyle = '#e6ee9c';
                ctx.fillRect(-14, -16, 4, 10);
                ctx.fillRect(-4, -18, 4, 12);
                ctx.fillRect(6, -18, 4, 12);
                ctx.fillRect(14, -16, 4, 10);

                ctx.fillStyle = '#afb42b';
                ctx.fillRect(-12, -14, 2, 8);
                ctx.fillRect(-2, -16, 2, 10);
                ctx.fillRect(8, -16, 2, 10);
                ctx.restore();
            }

            ctx.restore();
        }
    }

    class Piece {
        constructor(x, y, isLeft, color) {
            this.x = x;
            this.y = y;
            this.vx = isLeft ? -360 : 360;
            this.vy = -200;
            this.gravity = 1800;
            this.isLeft = isLeft;
            this.color = color;
            this.rotation = 0;
        }

        update(delta) {
            this.x += this.vx * delta;
            this.y += this.vy * delta;
            this.vy += this.gravity * delta;
            this.rotation += (this.isLeft ? -10 : 10) * delta;
        }

        draw() {
            ctx.save();
            ctx.imageSmoothingEnabled = false;
            ctx.translate(Math.round(this.x), Math.round(this.y));
            ctx.scale(1.7, 1.7);
            ctx.rotate(this.rotation);
            ctx.fillStyle = this.color;
            if (this.isLeft) {
                ctx.fillRect(-16, -16, 16, 32);
            } else {
                ctx.fillRect(0, -16, 16, 32);
            }
            ctx.restore();
        }
    }

    class ExplosionParticle {
        constructor(x, y, colorList = null, speedMult = 1.0) {
            this.x = x;
            this.y = y;
            this.vx = (Math.random() - 0.5) * 1450 * speedMult;
            this.vy = (Math.random() - 0.5) * 1450 * speedMult;
            this.size = Math.random() * 10 + 4;
            const colors = colorList || ['#d50000', '#ff1744', '#ff8a80', '#ffffff'];
            this.color = colors[Math.floor(Math.random() * colors.length)];
            this.life = Math.random() * 0.25 + 0.25;
            this.gravity = 1100;
        }

        update(delta) {
            this.x += this.vx * delta;
            this.y += this.vy * delta;
            this.vy += this.gravity * delta;
            this.life -= delta;
        }

        draw() {
            if (this.life <= 0) return;
            ctx.save();
            ctx.fillStyle = '#000000';
            ctx.fillRect(Math.round(this.x + 2), Math.round(this.y + 2), this.size, this.size);
            ctx.fillStyle = this.color;
            ctx.fillRect(Math.round(this.x), Math.round(this.y), this.size, this.size);
            ctx.restore();
        }
    }

    let spawnTimer = 0;
    // 💡 110 BPM 韻律控制（1拍 = 60/110 ≈ 0.5454 秒）
    const BPM_INTERVAL = 60 / 110; 

    function handleItems(delta) {
        if (!gameStarted || gameOver) {
            for (let item of items) item.draw();
            for (let p of slicedPieces) p.draw();
            for (let ex of explosions) ex.draw();
            for (let ft of floatingTexts) ft.draw();
            return;
        }

        if (isFever) {
            feverTimer -= delta;
            if (feverTimer <= 0) {
                isFever = false;
                feverTimer = 0;
                comboCount = 0;
                
                isCoolingDown = true;
                cooldownTimer = 1.5;
                speedMultiplier *= 1.08;
            }
        }

        if (isCoolingDown) {
            cooldownTimer -= delta;
            if (cooldownTimer <= 0) {
                isCoolingDown = false;
                cooldownTimer = 0;
                spawnTimer = 0;
            }
        }

        spawnTimer += delta;

        const level = Math.min(14, Math.floor(validTomatoesSliced / 10));

        if (!isCoolingDown) {
            if (isFever) {
                // Fever 模式下高密度的極速連拋
                if (spawnTimer >= 0.1) {
                    items.push(new FoodItem('tomato'));
                    if (Math.random() < 0.4) items.push(new FoodItem('tomato'));
                    spawnTimer = 0;
                }
            } else {
                const activeItemsCount = items.filter(item => !item.isSliced).length;

                // 💡 按照 110 BPM 節拍點進行拋球
                if (activeItemsCount === 0 && spawnTimer >= BPM_INTERVAL) {
                    const rand = Math.random();
                    let type = 'tomato';

                    const goldenChance = Math.max(0.04, 0.10 - level * 0.004);
                    const bombChance = Math.min(0.28, 0.15 + level * 0.008); 
                    const rottenChance = Math.min(0.28, 0.15 + level * 0.008);

                    if (rand < goldenChance) {
                        type = 'golden_tomato'; 
                    } else if (rand < goldenChance + rottenChance) {
                        type = 'rotten_tomato';
                    } else if (rand < goldenChance + rottenChance + bombChance) {
                        type = 'dumpling';
                    } else {
                        type = 'tomato';
                    }

                    items.push(new FoodItem(type));
                    spawnTimer = 0;
                }
            }
        }

        for (let i = items.length - 1; i >= 0; i--) {
            let item = items[i];
            item.update(delta);
            item.draw();
            if (item.y > GAME_HEIGHT + 60) {
                items.splice(i, 1);
            }
        }

        for (let i = slicedPieces.length - 1; i >= 0; i--) {
            let p = slicedPieces[i];
            p.update(delta);
            p.draw();
            if (p.y > GAME_HEIGHT + 60) slicedPieces.splice(i, 1);
        }

        for (let i = explosions.length - 1; i >= 0; i--) {
            let ex = explosions[i];
            ex.update(delta);
            ex.draw();
            if (ex.life <= 0) explosions.splice(i, 1);
        }

        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            let ft = floatingTexts[i];
            ft.update(delta);
            ft.draw();
            if (ft.opacity <= 0) floatingTexts.splice(i, 1);
        }
    }

    function trigger3FrameAnimation() {
        if (animTimer1) clearTimeout(animTimer1);
        if (animTimer2) clearTimeout(animTimer2);

        currentBgImg = bgImg2.isReady ? bgImg2 : bgImg1;

        animTimer1 = setTimeout(() => {
            currentBgImg = bgImg3.isReady ? bgImg3 : bgImg1;
            
            animTimer2 = setTimeout(() => {
                currentBgImg = bgImg1;
            }, 100);
        }, 80);
    }

    function swingKnife() {
        initAudioContext();

        if (gameOver || isCountingDown) {
            return; 
        }

        playSound('slash');
        trigger3FrameAnimation();

        const slashAngleType = Math.floor(Math.random() * 3);
        knifeSlash = { opacity: 1.0, type: slashAngleType };

        let sliceableItems = [];
        for (let i = items.length - 1; i >= 0; i--) {
            let item = items[i];
            if (!item.isSliced && item.y > 40 && item.y < GAME_HEIGHT - 40) {
                sliceableItems.push({ item, index: i });
            }
        }

        let maxAllowedSlice = sliceableItems.length;
        if (isFever && sliceableItems.length > 1) {
            maxAllowedSlice = Math.ceil(sliceableItems.length * 0.7);
        }

        let slicedCount = 0;

        for (let obj of sliceableItems) {
            if (slicedCount >= maxAllowedSlice) break;

            let item = obj.item;
            let i = obj.index;
            item.isSliced = true;
            slicedCount++;

            const maxRiseHeight = GAME_HEIGHT - item.peakY;
            const perfectThresholdY = item.peakY + maxRiseHeight * 0.30;

            let gradeMsg = "GREAT!";
            let gradeColor = "#ffffff"; 
            let multiplier = 2;

            if (item.y <= perfectThresholdY) {
                gradeMsg = "PERFECT!";
                gradeColor = "#ffea00"; 
                multiplier = 3;
            }

            if (item.type === 'tomato') {
                playSound('hit');
                const addedScore = 100 * multiplier;
                score += addedScore;

                if (!isFever) {
                    validTomatoesSliced++;
                }

                if (isFever) {
                    screenShake = 10;
                    const tomatoColors = ['#d50000', '#ff1744', '#ff8a80', '#ffffff'];
                    for (let k = 0; k < 35; k++) {
                        explosions.push(new ExplosionParticle(item.x, item.y, tomatoColors, 1.4));
                    }
                }

                if (!isFever && !isCoolingDown) {
                    comboCount++;
                    if (comboCount >= MAX_COMBO) {
                        isFever = true;
                        feverTimer = 5.0;
                        comboCount = 0;
                        screenShake = 18;
                        playSound('fever');
                    } else {
                        floatingTexts.push(new FloatingText(`${gradeMsg} +${addedScore}`, item.x, item.y - 30, gradeColor, 18));
                    }
                } else {
                    floatingTexts.push(new FloatingText(`${gradeMsg} +${addedScore}`, item.x, item.y - 30, gradeColor, 18));
                }

                slicedPieces.push(new Piece(item.x, item.y, true, '#d50000'));
                slicedPieces.push(new Piece(item.x, item.y, false, '#d50000'));
            } else if (item.type === 'golden_tomato') {
                playSound('heal');
                const addedScore = 300 * multiplier;
                score += addedScore;
                if (lives < maxLives) lives++;

                if (!isFever) {
                    validTomatoesSliced++;
                }

                for (let k = 0; k < 25; k++) {
                    explosions.push(new ExplosionParticle(item.x, item.y, ['#ffea00', '#ffffff', '#ffd54f']));
                }

                if (!isFever && !isCoolingDown) {
                    comboCount++;
                    if (comboCount >= MAX_COMBO) {
                        isFever = true;
                        feverTimer = 5.0;
                        comboCount = 0;
                        screenShake = 18;
                        playSound('fever');
                    } else {
                        floatingTexts.push(new FloatingText(`${gradeMsg} +${addedScore} ❤️`, item.x, item.y - 30, gradeColor, 18));
                    }
                } else {
                    floatingTexts.push(new FloatingText(`${gradeMsg} +${addedScore} ❤️`, item.x, item.y - 30, gradeColor, 18));
                }

                slicedPieces.push(new Piece(item.x, item.y, true, '#ffd54f'));
                slicedPieces.push(new Piece(item.x, item.y, false, '#ffd54f'));
            } else if (item.type === 'rotten_tomato') {
                playSound('explosion');
                lives--;
                if (!isCoolingDown) comboCount = 0;
                floatingTexts.push(new FloatingText("BAD! -1 ❤️", item.x, item.y - 30, '#ff1744', 18));
                slicedPieces.push(new Piece(item.x, item.y, true, '#6a1b29'));
                slicedPieces.push(new Piece(item.x, item.y, false, '#6a1b29'));
                for (let k = 0; k < 20; k++) {
                    explosions.push(new ExplosionParticle(item.x, item.y, ['#6a1b29', '#2d0812', '#ff1744']));
                }
                if (lives <= 0) {
                    lives = 0;
                    gameOver = true;
                    gameOverLockTime = 0.5;
                }
            } else if (item.type === 'dumpling') {
                playSound('explosion');
                lives--;
                if (!isCoolingDown) comboCount = 0;
                floatingTexts.push(new FloatingText("BOMB! -1 ❤️", item.x, item.y - 30, '#ff1744', 18));
                for (let k = 0; k < 35; k++) {
                    explosions.push(new ExplosionParticle(item.x, item.y, ['#ff1744', '#ffea00', '#ff9100', '#ffffff']));
                }
                if (lives <= 0) {
                    lives = 0;
                    gameOver = true;
                    gameOverLockTime = 0.5;
                }
            }
        }

        for (let i = items.length - 1; i >= 0; i--) {
            if (items[i].isSliced) {
                items.splice(i, 1);
            }
        }
    }

    function handleCountdown(delta) {
        if (!isCountingDown) return;

        countdownTimer += delta;

        const steps = [
            { text: '3', color: '#ffffff', sound: 'beep' },
            { text: '2', color: '#ffea00', sound: 'beep' },
            { text: '1', color: '#ff9800', sound: 'beep' },
            { text: 'START!', color: '#ff1744', sound: 'beep_final' }
        ];

        const stepInterval = 0.85;
        const currentIdx = Math.floor(countdownTimer / stepInterval);

        if (currentIdx !== countdownStep && currentIdx < steps.length) {
            countdownStep = currentIdx;
            playSound(steps[countdownStep].sound);
        }

        if (currentIdx >= steps.length) {
            isCountingDown = false;
            gameStarted = true;
            return;
        }

        ctx.save();
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.lineWidth = 2;
        const lineSpacing = 10;

        for (let x = -GAME_HEIGHT; x < GAME_WIDTH + GAME_HEIGHT; x += lineSpacing) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x + GAME_HEIGHT, GAME_HEIGHT);
            ctx.stroke();
        }

        for (let x = GAME_WIDTH + GAME_HEIGHT; x > -GAME_HEIGHT; x -= lineSpacing * 1.5) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x - GAME_HEIGHT, GAME_HEIGHT);
            ctx.stroke();
        }

        const step = steps[countdownStep] || steps[0];
        const progressInStep = (countdownTimer % stepInterval) / stepInterval;
        const scale = 1.0 + Math.sin(progressInStep * Math.PI) * 0.35; 

        ctx.translate(GAME_WIDTH / 2, GAME_HEIGHT / 2);
        ctx.scale(scale, scale);
        drawPixelText(step.text, 0, 0, step.color, 76, 'center');
        ctx.restore();
    }

    function drawUI() {
        drawPixelBox(20, 20, 220, 50, '#111111', '#ffffff', '#000000', 4);
        drawPixelText(`SCORE:${score}`, 130, 47, '#ffffff', 14, 'center');

        let heartsStr = '';
        for (let i = 0; i < maxLives; i++) heartsStr += (i < lives) ? '❤️' : '🖤';
        const hpColor = lives <= 1 ? '#ff1744' : '#ffeb3b';
        drawPixelBox(GAME_WIDTH - 240, 20, 220, 50, '#111111', hpColor, '#000000', 4);
        drawPixelText(`HP:${heartsStr}`, GAME_WIDTH - 130, 47, hpColor, 14, 'center');

        const barX = 260;
        const barY = 31;
        const barW = 280;
        const barH = 28;
        const radius = 14;

        let barBorderColor = '#555555';
        if (isFever) {
            const flashTick = Math.floor(Date.now() / 80) % 2;
            barBorderColor = flashTick === 0 ? '#ffea00' : '#ff1744';
        } else if (comboCount >= MAX_COMBO && !isCoolingDown) {
            barBorderColor = '#ffea00';
        }

        function drawRoundedBarPath(x, y, w, h, r) {
            ctx.beginPath();
            ctx.arc(x + r, y + r, r, Math.PI * 0.5, Math.PI * 1.5);
            ctx.lineTo(x + w - r, y);
            ctx.arc(x + w - r, y + r, r, Math.PI * 1.5, Math.PI * 0.5);
            ctx.lineTo(x + r, y + h);
            ctx.closePath();
        }

        ctx.save();
        ctx.fillStyle = '#000000';
        drawRoundedBarPath(barX + 3, barY + 3, barW, barH, radius);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        drawRoundedBarPath(barX, barY, barW, barH, radius);
        ctx.fill();

        ctx.strokeStyle = barBorderColor;
        ctx.lineWidth = 3;
        ctx.stroke();

        let fillRatio = 0;
        if (isFever) {
            fillRatio = Math.max(0, feverTimer / 5.0);
        } else if (!isCoolingDown) {
            fillRatio = Math.min(1.0, comboCount / MAX_COMBO);
        } else {
            fillRatio = 0;
        }

        if (fillRatio > 0) {
            ctx.save();
            drawRoundedBarPath(barX, barY, barW, barH, radius);
            ctx.clip();

            const fillW = barW * fillRatio;
            const cycle = (Date.now() % 3000) / 3000;
            const shift = (Math.sin(cycle * Math.PI * 2) + 1) / 2;

            const grad = ctx.createLinearGradient(barX, barY, barX + barW, barY);
            if (shift < 0.5) {
                grad.addColorStop(0, '#ff1744');
                grad.addColorStop(0.5 + shift, '#ffea00');
                grad.addColorStop(1, '#ff1744');
            } else {
                grad.addColorStop(0, '#ffea00');
                grad.addColorStop(shift - 0.5, '#ff1744');
                grad.addColorStop(1, '#ffea00');
            }

            ctx.fillStyle = grad;
            ctx.fillRect(barX, barY, fillW, barH);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.fillRect(barX, barY, fillW, 4);
            ctx.restore();
        }

        drawPixelTomatoIcon(barX + barW / 2, barY + barH / 2, 1.3);
        ctx.restore();

        // 💡 難度 Level 顯示 (最高 LV.15)
        const currentLevel = Math.min(15, Math.floor(validTomatoesSliced / 10) + 1);
        const levelStr = currentLevel >= 15 ? 'LV.15 MAX' : `LV.${currentLevel}`;
        
        drawPixelBox(GAME_WIDTH / 2 - 60, barY + barH + 8, 120, 26, '#111111', '#ffea00', '#000000', 3);
        drawPixelText(levelStr, GAME_WIDTH / 2, barY + barH + 21, '#ffea00', 11, 'center');

        if (isFever) {
            drawPixelText("🔥BREAK THE RULES!!🔥", GAME_WIDTH / 2, barY - 12, '#ffea00', 13, 'center');
        }

        if (knifeSlash) {
            ctx.save();
            ctx.strokeStyle = `rgba(255, 255, 255, ${knifeSlash.opacity})`;
            ctx.lineWidth = 10;
            ctx.beginPath();

            if (knifeSlash.type === 0) {
                ctx.moveTo(80, GAME_HEIGHT - 100);
                ctx.lineTo(GAME_WIDTH - 80, 100);
            } else if (knifeSlash.type === 1) {
                ctx.moveTo(80, 100);
                ctx.lineTo(GAME_WIDTH - 80, GAME_HEIGHT - 100);
            } else {
                ctx.moveTo(50, GAME_HEIGHT / 2);
                ctx.lineTo(GAME_WIDTH - 50, GAME_HEIGHT / 2);
            }

            ctx.stroke();
            ctx.restore();

            knifeSlash.opacity -= 0.15;
            if (knifeSlash.opacity <= 0) knifeSlash = null;
        }

        if (gameOver) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.90)';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            drawPixelBox(100, 70, 600, 460, '#111111', '#ff1744', '#000000', 6);
            drawPixelText('GAME OVER', GAME_WIDTH / 2, 130, '#ff1744', 28, 'center');
            drawPixelText(`FINAL SCORE: ${score}`, GAME_WIDTH / 2, 190, '#ffeb3b', 16, 'center');

            if (gameOverLockTime > 0) {
                drawPixelText(`PLEASE WAIT...`, GAME_WIDTH / 2, 280, '#888888', 14, 'center');
            } else {
                drawPixelBox(180, 260, 440, 50, '#d50000', '#ffea00', '#000000', 4);
                drawPixelText('CONTINUE?', GAME_WIDTH / 2, 285, '#ffffff', 14, 'center');

                drawPixelBox(180, 330, 440, 50, '#333333', '#ffffff', '#000000', 4);
                drawPixelText('GONNA STOP?', GAME_WIDTH / 2, 355, '#ff4081', 14, 'center');

                const mvBtnX = 155;
                const mvBtnY = 430;
                const mvBtnW = 490;
                const mvBtnH = 70;
                drawPixelBox(mvBtnX, mvBtnY, mvBtnW, mvBtnH, '#ffffff', '#C1001B', '#000000', 4);
                
                drawPixelTomatoIcon(mvBtnX + 28, mvBtnY + mvBtnH / 2, 1.0);
                
                drawPixelText('按此觀看COLLAR《管理還管你》MV', GAME_WIDTH / 2, mvBtnY + mvBtnH / 2, '#ffffff', 21, 'center', true);
                
                drawPixelTomatoIcon(mvBtnX + mvBtnW - 28, mvBtnY + mvBtnH / 2, 1.0);
            }
        }
    }

    function resetGame() {
        score = 0;
        lives = 3;
        validTomatoesSliced = 0;
        comboCount = 0;
        isFever = false;
        feverTimer = 0;
        isCoolingDown = false;
        cooldownTimer = 0;
        screenShake = 0;
        speedMultiplier = 1.0;
        gameOver = false;
        gameOverLockTime = 0;
        items = [];
        slicedPieces = [];
        explosions = [];
        floatingTexts = [];
        spawnTimer = 0;

        gameStarted = false;
        isCountingDown = true;
        countdownStep = -1;
        countdownTimer = 0;
    }

    function gameLoop() {
        const now = Date.now();
        const delta = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;

        ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        drawCleanBackground();

        handleItems(delta);

        if (gameOver && gameOverLockTime > 0) {
            gameOverLockTime = Math.max(0, gameOverLockTime - delta);
        }

        drawUI();

        if (isCountingDown) {
            handleCountdown(delta);
        }

        requestAnimationFrame(gameLoop);
    }

    function handleInput(e) {
        if (e) e.preventDefault();
        
        if (isCountingDown) return;

        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
        const clientY = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
        const x = (clientX - rect.left) * (GAME_WIDTH / rect.width);
        const y = (clientY - rect.top) * (GAME_HEIGHT / rect.height);

        if (gameOver && gameOverLockTime <= 0) {
            if (x >= 180 && x <= 620 && y >= 260 && y <= 310) {
                resetGame();
                return;
            }
            if (x >= 180 && x <= 620 && y >= 330 && y <= 380) {
                if (window.top) {
                    window.top.location.href = 'index.html';
                } else {
                    window.location.href = 'index.html';
                }
                return;
            }
            if (x >= 155 && x <= 645 && y >= 430 && y <= 500) {
                window.open('https://youtu.be/4DObQP77xAs?si=lQ__OsG39YGlsKWd', '_blank');
                return;
            }
            return;
        }

        swingKnife();
    }

    container.addEventListener('pointerdown', handleInput);

    gameLoop();
}

if (document.fonts) {
    document.fonts.ready.then(() => {
        initGame();
    });
} else {
    if (document.readyState === 'interactive' || document.readyState === 'complete') {
        initGame();
    } else {
        document.addEventListener('DOMContentLoaded', initGame);
    }
}
</script>
