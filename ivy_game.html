<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tomato Plucking - Ultimate Edition</title>
    <!-- 💡 引入 Google Fonts Press Start 2P 像素字型 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* 💡 載入本地 fonts 資料夾內的「縫合像素繁體-12px-比例.ttf」 */
        @font-face {
            font-family: 'StitchPixelFont';
            src: url('./fonts/縫合像素繁體-12px-比例.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Press Start 2P', 'StitchPixelFont', monospace;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Press Start 2P', 'StitchPixelFont', monospace;
        }
        #gameContainer {
            position: relative;
            width: 96vw;
            height: 72vw;
            max-width: 800px;
            max-height: 600px;
            background-color: #000;
            box-shadow: 0 0 30px #000;
            overflow: hidden;
            touch-action: none;
        }
        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: auto;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
</div>

<script>
(function() {
    const canvas = document.getElementById('gameCanvas');
    const container = document.getElementById('gameContainer');

    if (!canvas) return;
    
    const ctx = canvas.getContext('2d');

    const GAME_WIDTH = 800;
    const GAME_HEIGHT = 600;

    let bgDrawRect = { x: 0, y: 0, w: GAME_WIDTH, h: GAME_HEIGHT, bottom: GAME_HEIGHT };

    // 💡 離屏 Film Grain (噪點) Canvas
    const noiseCanvas = document.createElement('canvas');
    noiseCanvas.width = 160;
    noiseCanvas.height = 120;
    const noiseCtx = noiseCanvas.getContext('2d');

    function updateFilmGrain() {
        if (!noiseCtx) return;
        const imgData = noiseCtx.createImageData(160, 120);
        const buffer = new Uint32Array(imgData.data.buffer);
        const len = buffer.length;
        for (let i = 0; i < len; i++) {
            const val = Math.floor(Math.random() * 255);
            buffer[i] = (22 << 24) | (val << 16) | (val << 8) | val;
        }
        noiseCtx.putImageData(imgData, 0, 0);
    }

    function drawFilmGrainOverlay() {
        ctx.save();
        ctx.globalCompositeOperation = 'overlay';
        ctx.globalAlpha = 0.6;
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(noiseCanvas, 0, 0, GAME_WIDTH, GAME_HEIGHT);
        ctx.restore();
    }

    function loadRobustImage(baseName) {
        const img = new Image();
        img.isReady = false;
        const sources = [
            `images/${baseName}.jpg.jpg`,
            `images/${baseName}.jpg`,
            `./images/${baseName}.jpg`,
            `${baseName}.jpg.jpg`,
            `${baseName}.jpg`,
            `images/${baseName}.png`,
            `${baseName}.png`
        ];
        let srcIdx = 0;

        img.onload = () => { img.isReady = true; };
        img.onerror = () => {
            srcIdx++;
            if (srcIdx < sources.length) {
                img.src = sources[srcIdx];
            }
        };
        img.src = sources[0];
        return img;
    }

    const bgIvy1  = loadRobustImage('ivybg1');
    const bgIvy2  = loadRobustImage('ivybg2');
    const bgIvy3  = loadRobustImage('ivybg3');
    const bgIvy4  = loadRobustImage('ivybg4');
    const bgIvy5  = loadRobustImage('ivybg5');

    let currentBgImg = bgIvy1;
    let pullToggle = false;

    let score = 0;
    let timeLeft = 20.0;

    // 💡 倒數計時相關變數
    let gameStarted = false;
    let isCountingDown = true;
    let countdownStep = -1;
    let countdownTimer = 0;

    let gameOver = false;
    let gameOverLockTime = 0;
    let isFirstSpawn = true;

    // Fever Mode 變數系統
    let comboCount = 0;
    let isFever = false;
    let feverTimer = 0;
    const MAX_FEVER_TIME = 6.0;
    let feverCooldown = 0;
    let screenShake = 0;

    let particles = [];
    let bottomEmitters = [];
    let floatingTexts = [];

    let audioCtx = null;
    let animTimer = null;
    let lastTime = Date.now();

    let currentTomato = null;
    let isTransitioning = false;

    const discardBtn = { x: 550, y: 210, w: 120, h: 120 };

    // 💡 獨立模式 AudioContext + 事件解鎖機制
    function initAudioContext() {
        try {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) audioCtx = new AudioContextClass();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        } catch(e) {}
    }

    // 💡 監聽來自父頁面的解鎖訊號
    window.addEventListener('message', (e) => {
        if (e.data === 'UNLOCK_AUDIO' || (e.data && e.data.action === 'UNLOCK_AUDIO')) {
            initAudioContext();
        }
    });

    window.addEventListener('pointerdown', initAudioContext, { passive: true });
    window.addEventListener('touchstart', initAudioContext, { passive: true });

    function playSound(type) {
        try {
            initAudioContext();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'pull') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(350 + Math.random() * 100, now);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            } else if (type === 'pluck') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523, now);
                osc.frequency.setValueAtTime(783, now + 0.08);
                gain.gain.setValueAtTime(0.35, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'discard') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(650, now + 0.15);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'bad') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.linearRampToValueAtTime(50, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'fever') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523, now);
                osc.frequency.setValueAtTime(659, now + 0.08);
                osc.frequency.setValueAtTime(783, now + 0.16);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'beep') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                gain.gain.setValueAtTime(0.8, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'beep_final') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(880, now);
                gain.gain.setValueAtTime(0.8, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        } catch(e) {}
    }

    function drawSmoothImage(img) {
        if (!img || !img.isReady || img.width === 0 || img.height === 0) {
            ctx.fillStyle = '#222222';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            return;
        }

        try {
            ctx.save();
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';

            if (screenShake > 0) {
                const rx = (Math.random() - 0.5) * screenShake * 2;
                const ry = (Math.random() - 0.5) * screenShake * 2;
                ctx.translate(rx, ry);
                screenShake *= 0.82;
                if (screenShake < 0.5) screenShake = 0;
            }

            const imgRatio = img.width / img.height;
            const canvasRatio = GAME_WIDTH / GAME_HEIGHT;
            let drawW, drawH, drawX, drawY;

            if (imgRatio > canvasRatio) {
                drawH = GAME_HEIGHT;
                drawW = GAME_HEIGHT * imgRatio;
                drawX = (GAME_WIDTH - drawW) / 2;
                drawY = 0;
            } else {
                drawW = GAME_WIDTH;
                drawH = GAME_WIDTH / imgRatio;
                drawX = 0;
                drawY = (GAME_HEIGHT - drawH) / 2;
            }

            bgDrawRect = { x: drawX, y: drawY, w: drawW, h: drawH, bottom: drawY + drawH };

            ctx.drawImage(img, drawX, drawY, drawW, drawH);
            ctx.restore();
        } catch(e) {
            ctx.fillStyle = '#222222';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
        }
    }

    function drawPixelBox(x, y, w, h, bgColor, borderColor, shadowColor = '#000000', pixelSize = 4) {
        ctx.save();
        ctx.globalAlpha = 1.0;
        ctx.imageSmoothingEnabled = false;
        ctx.fillStyle = shadowColor;
        ctx.fillRect(x + pixelSize, y + pixelSize, w, h);
        ctx.fillStyle = bgColor;
        ctx.fillRect(x, y, w, h);
        ctx.fillStyle = borderColor;
        ctx.fillRect(x, y, w, pixelSize); 
        ctx.fillRect(x, y + h - pixelSize, w, pixelSize); 
        ctx.fillRect(x, y, pixelSize, h); 
        ctx.fillRect(x + w - pixelSize, y, pixelSize, h); 
        ctx.restore();
    }

    function drawPixelText(text, x, y, color = '#ffffff', fontSize = 16, align = 'center', useOnlyStitchFont = false) {
        ctx.save();
        ctx.globalAlpha = 1.0;
        ctx.imageSmoothingEnabled = false;
        if (useOnlyStitchFont) {
            ctx.font = `${fontSize}px "StitchPixelFont", monospace`;
        } else {
            ctx.font = `${fontSize}px "Press Start 2P", "StitchPixelFont", monospace`;
        }
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        
        ctx.fillStyle = '#000000';
        const offsets = [[-2,0], [2,0], [0,-2], [0,2], [-2,-2], [2,-2], [-2,2], [2,2]];
        for (let [ox, oy] of offsets) {
            ctx.fillText(text, x + ox, y + oy);
        }
        
        ctx.fillStyle = color;
        ctx.fillText(text, x, y);
        ctx.restore();
    }

    function drawPixelTomatoIcon(cx, cy, scale = 1.0) {
        ctx.save();
        ctx.translate(Math.round(cx), Math.round(cy));
        ctx.scale(scale, scale);

        let mainColor = '#d50000';
        let highlightColor = '#ff8a80';
        let stemColor = '#1b5e20';

        ctx.fillStyle = stemColor;
        ctx.fillRect(-6, -22, 12, 6);
        ctx.fillRect(-3, -25, 6, 4);

        ctx.fillStyle = '#000000';
        ctx.fillRect(-21, -16, 42, 32);
        ctx.fillRect(-16, -21, 32, 42);

        ctx.fillStyle = mainColor;
        ctx.fillRect(-19, -14, 38, 28);
        ctx.fillRect(-14, -19, 28, 38);

        ctx.fillStyle = highlightColor;
        ctx.fillRect(-12, -12, 8, 8);
        ctx.restore();
    }

    function drawClassicPixelTomato(x, y, type = 'normal', targetSize = 48) {
        ctx.save();
        ctx.translate(Math.round(x), Math.round(y));
        ctx.rotate(-Math.PI / 2);
        const scale = (targetSize / 42) * 0.9;
        ctx.scale(scale, scale);
        ctx.imageSmoothingEnabled = false;

        let mainColor = '#d50000';
        let highlightColor = '#ff8a80';
        let stemColor = '#1b5e20';

        if (type === 'golden') {
            mainColor = '#e53935';
            highlightColor = '#fff59d';
            stemColor = '#76ff03';
        } else if (type === 'rotten') {
            mainColor = '#6a1b29';
            highlightColor = '#a73a4b';
            stemColor = '#33691e';
        }

        ctx.fillStyle = '#000000';
        ctx.fillRect(-21, -16, 42, 32);
        ctx.fillRect(-16, -21, 32, 42);

        ctx.fillStyle = mainColor;
        ctx.fillRect(-19, -14, 38, 28);
        ctx.fillRect(-14, -19, 28, 38);

        ctx.fillStyle = highlightColor;
        ctx.fillRect(4, -12, 8, 8);

        ctx.fillStyle = stemColor;
        ctx.fillRect(15, -6, 6, 11);
        ctx.fillRect(20, -3, 5, 5);

        ctx.restore();
    }

    class Tomato {
        constructor() {
            let rand = Math.random();
            
            if (isFirstSpawn) {
                if (rand < 0.30) rand = 0.5;
                isFirstSpawn = false;
            }

            if (isFever) {
                this.type = 'normal';
                this.maxHits = 1;
                this.scoreValue = 300;
                this.timeBonus = 0;
            } else {
                if (rand < 0.15) {
                    this.type = 'golden';
                    this.maxHits = 5;
                    this.scoreValue = 600;
                    this.timeBonus = 1.5;
                } else if (rand < 0.38) {
                    this.type = 'rotten';
                    this.maxHits = 2;
                    this.scoreValue = 0;
                    this.timeBonus = -1.5;
                } else {
                    this.type = 'normal';
                    this.maxHits = 3;
                    this.scoreValue = 300;
                    this.timeBonus = 0;
                }
            }

            this.hitsDone = 0;
            this.y = 392;
            this.glowTimer = 0;
            this.isPlucked = false;
        }

        updatePosition() {
            if (currentBgImg === bgIvy3 || currentBgImg === bgIvy4 || currentBgImg === bgIvy5) {
                this.x = 193;
                this.y = 402;
            } else if (currentBgImg === bgIvy2) {
                this.x = 208;
                this.y = 392;
            } else {
                this.x = 228;
                this.y = 392;
            }
        }

        draw() {
            this.updatePosition();

            ctx.save();
            ctx.globalAlpha = 1.0;
            ctx.imageSmoothingEnabled = false;
            ctx.translate(this.x, this.y);

            this.glowTimer += 0.1;

            if (this.type === 'golden') {
                const alpha = 0.4 + Math.sin(this.glowTimer) * 0.25;
                ctx.fillStyle = `rgba(255, 215, 0, ${alpha})`;
                ctx.beginPath();
                ctx.arc(0, 0, 70, 0, Math.PI * 2);
                ctx.fill();
            } else if (this.type === 'rotten') {
                const alpha = 0.3 + Math.sin(this.glowTimer * 2) * 0.2;
                ctx.fillStyle = `rgba(255, 23, 68, ${alpha})`;
                ctx.beginPath();
                ctx.arc(0, 0, 75, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.scale(2.0, 2.0);

            let mainColor = '#d50000';
            let highlightColor = '#ff8a80';
            let stemColor = '#1b5e20';

            if (this.type === 'golden') {
                mainColor = '#e53935';
                highlightColor = '#fff59d';
                stemColor = '#76ff03';
            } else if (this.type === 'rotten') {
                mainColor = '#6a1b29';
                highlightColor = '#a73a4b';
                stemColor = '#33691e';
            }

            ctx.fillStyle = '#000000';
            ctx.fillRect(-21, -16, 42, 32);
            ctx.fillRect(-16, -21, 32, 42);

            ctx.fillStyle = mainColor;
            ctx.fillRect(-19, -14, 38, 28);
            ctx.fillRect(-14, -19, 28, 38);

            if (this.type === 'rotten') {
                ctx.fillStyle = '#2d0812';
                ctx.fillRect(-14, 2, 28, 17);
                ctx.fillStyle = '#000000';
                ctx.fillRect(-10, 8, 20, 10);
            }

            ctx.fillStyle = highlightColor;
            ctx.fillRect(-12, -12, 8, 8);

            if (!this.isPlucked) {
                const pullX = (this.hitsDone * 5.0);
                ctx.fillStyle = stemColor;
                if (this.hitsDone > 0) {
                    ctx.fillRect(15, -3, pullX, 5);
                }
                ctx.fillRect(15 + pullX, -6, 6, 11);
                ctx.fillRect(20 + pullX, -3, 5, 5);
            }

            ctx.restore();

            if (!this.isPlucked) {
                this.drawHealthBar();
            }
        }

        drawHealthBar() {
            const remainingHits = Math.max(0, this.maxHits - this.hitsDone);
            const barY = this.y + 65;
            
            ctx.save();
            ctx.globalAlpha = 1.0;
            ctx.imageSmoothingEnabled = false;
            if (this.type === 'rotten') {
                const totalW = 140;
                drawPixelBox(this.x - totalW / 2, barY, totalW, 22, '#1a0005', '#ff1744', '#000000', 3);
                
                for (let i = 0; i < 2; i++) {
                    const bx = this.x - 45 + i * 48;
                    const by = barY + 4;
                    if (i < remainingHits) {
                        ctx.fillStyle = '#ff1744';
                        ctx.fillRect(bx, by, 42, 14);
                    } else {
                        ctx.fillStyle = '#333333';
                        ctx.fillRect(bx, by, 42, 14);
                    }
                }
            } else {
                const blockW = 20;
                const blockH = 12;
                const gap = 4;
                const totalW = this.maxHits * (blockW + gap) - gap + 12;
                const startX = this.x - totalW / 2 + 6;

                drawPixelBox(this.x - totalW / 2, barY, totalW, blockH + 8, '#111111', '#ffffff', '#000000', 3);

                let blockColor = (this.type === 'golden') ? '#ffea00' : '#00e676';
                for (let i = 0; i < this.maxHits; i++) {
                    const bx = startX + i * (blockW + gap);
                    const by = barY + 4;

                    if (i < remainingHits) {
                        ctx.fillStyle = blockColor;
                        ctx.fillRect(bx, by, blockW, blockH);
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(bx + 2, by + 2, 4, 3);
                    } else {
                        ctx.fillStyle = '#333333';
                        ctx.fillRect(bx, by, blockW, blockH);
                    }
                }
            }
            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color, vxDir = 1, speedMult = 1.0) {
            this.x = x + (Math.random() - 0.5) * 35;
            this.y = y + (Math.random() - 0.5) * 35;
            this.vx = (Math.random() * 10 + 5) * vxDir * speedMult;
            this.vy = (-Math.random() * 8 - 3) * speedMult;
            this.size = Math.random() * 10 + 4;
            this.color = color;
            this.life = 25;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += 0.35;
            this.life--;
        }

        draw() {
            if (this.life <= 0) return;
            ctx.fillStyle = this.color;
            ctx.fillRect(Math.round(this.x), Math.round(this.y), this.size, this.size);
        }
    }

    class BottomTomatoEmitter {
        constructor(kind = 'tomato') {
            this.x = bgDrawRect.x + Math.random() * bgDrawRect.w;
            this.y = bgDrawRect.bottom + 10;
            this.vx = (Math.random() - 0.5) * 9;
            
            const targetHeight = bgDrawRect.h * (0.24 + Math.random() * 0.12);
            this.gravity = 0.52;
            this.vy = -Math.sqrt(2 * this.gravity * targetHeight);

            this.kind = kind;
            this.life = 48;

            if (this.kind === 'tomato') {
                this.size = Math.random() * 20 + 55;
            } else {
                this.size = Math.random() * 12 + 12;
                this.color = Math.random() < 0.5 ? '#ffea00' : '#ff1744'; 
            }
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += this.gravity;
            this.life--;
        }

        draw() {
            if (this.life <= 0) return;

            if (this.kind === 'tomato') {
                drawClassicPixelTomato(this.x, this.y, 'normal', this.size);
            } else {
                ctx.save();
                ctx.translate(Math.round(this.x), Math.round(this.y));
                ctx.fillStyle = '#000000';
                ctx.fillRect(-this.size / 2 - 2, -this.size / 2 - 2, this.size + 4, this.size + 4);
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
                ctx.restore();
            }
        }
    }

    class FloatingText {
        constructor(text, color, fontSize = 24) {
            this.text = text;
            this.color = color;
            this.fontSize = fontSize;
            this.x = GAME_WIDTH / 2;
            this.y = 290;
            this.opacity = 1.0;
        }

        update() {
            this.y -= 1.8;
            this.opacity -= 0.03;
        }

        draw() {
            if (this.opacity <= 0) return;
            drawPixelText(this.text, this.x, this.y, this.color, this.fontSize, 'center');
        }
    }

    function spawnNextTomato() {
        currentTomato = new Tomato();
        isTransitioning = false;
        currentBgImg = bgIvy1;
    }

    function triggerPullAnimation() {
        if (animTimer) clearTimeout(animTimer);
        pullToggle = !pullToggle;
        currentBgImg = pullToggle ? (bgIvy2.isReady ? bgIvy2 : bgIvy1) : (bgIvy1.isReady ? bgIvy1 : bgIvy2);
        animTimer = setTimeout(() => {
            currentBgImg = bgIvy1;
        }, 120);
    }

    function triggerSuccessAnimation(callback) {
        if (animTimer) clearTimeout(animTimer);
        currentBgImg = bgIvy3.isReady ? bgIvy3 : bgIvy1;
        
        const delay = isFever ? 40 : 180;

        setTimeout(() => {
            currentBgImg = bgIvy4.isReady ? bgIvy4 : bgIvy1;
            setTimeout(() => {
                currentBgImg = bgIvy5.isReady ? bgIvy5 : bgIvy1;
                setTimeout(() => {
                    if (callback) callback();
                }, delay);
            }, delay);
        }, delay);
    }

    function checkComboAndFever() {
        if (!isFever && feverCooldown <= 0) {
            comboCount++;
            if (comboCount >= 8) {
                isFever = true;
                feverTimer = MAX_FEVER_TIME;
                comboCount = 0;
                screenShake = 22;
                playSound('fever');
                floatingTexts.push(new FloatingText("🔥 BREAK THE RULES!! 🔥", '#ffea00', 20));

                for (let i = 0; i < 24; i++) bottomEmitters.push(new BottomTomatoEmitter('tomato'));
                for (let i = 0; i < 30; i++) bottomEmitters.push(new BottomTomatoEmitter('particle'));
            }
        }
    }

    function handleDiscardClick() {
        if (isTransitioning || !currentTomato || feverCooldown > 0) return;

        if (currentTomato.type === 'rotten') {
            isTransitioning = true;
            playSound('discard');
            score += 150;
            timeLeft += 4.0;
            
            checkComboAndFever();

            floatingTexts.push(new FloatingText("+150 (+4.0s) ★", '#76ff03', 20));
            for (let k = 0; k < 22; k++) {
                particles.push(new Particle(currentTomato.x, currentTomato.y, '#76ff03', -1));
            }
            
            triggerSuccessAnimation(() => {
                spawnNextTomato();
            });
        } else {
            playSound('bad');
            timeLeft = Math.max(0, timeLeft - 1.5);
            comboCount = 0;
            floatingTexts.push(new FloatingText("WASTED! -1.5s 💥", '#ff1744', 20));
            for (let k = 0; k < 18; k++) {
                particles.push(new Particle(discardBtn.x + 60, discardBtn.y + 60, '#ff1744', -1));
            }
        }
    }

    function handlePullClick() {
        if (isTransitioning || !currentTomato || feverCooldown > 0) return;

        triggerPullAnimation();

        if (currentTomato.type === 'rotten') {
            playSound('bad');
            timeLeft = Math.max(0, timeLeft + currentTomato.timeBonus);
            currentTomato.hitsDone++;
            comboCount = 0;

            floatingTexts.push(new FloatingText("BAD! -1.5s 💥", '#ff1744', 20));
            for (let k = 0; k < 15; k++) {
                particles.push(new Particle(currentTomato.x, currentTomato.y, '#6a1b29', 1));
            }
            
            if (currentTomato.hitsDone >= currentTomato.maxHits) {
                isTransitioning = true;
                setTimeout(spawnNextTomato, 500);
            }
            return;
        }

        currentTomato.hitsDone++;

        if (currentTomato.hitsDone >= currentTomato.maxHits) {
            currentTomato.isPlucked = true;
            isTransitioning = true;
            playSound('pluck');
            score += currentTomato.scoreValue;

            checkComboAndFever();

            if (isFever) {
                screenShake = 16;
                floatingTexts.push(new FloatingText("+300 ★", '#ffea00', 22));

                for (let i = 0; i < 10; i++) bottomEmitters.push(new BottomTomatoEmitter('tomato'));
                for (let i = 0; i < 15; i++) bottomEmitters.push(new BottomTomatoEmitter('particle'));

                const feverColors = ['#ffea00', '#ff1744', '#ffffff'];
                for (let k = 0; k < 25; k++) {
                    const randomColor = feverColors[Math.floor(Math.random() * feverColors.length)];
                    particles.push(new Particle(currentTomato.x + 30, currentTomato.y - 20, randomColor, 1, 1.3));
                }
            } else if (currentTomato.type === 'golden') {
                timeLeft += currentTomato.timeBonus;
                floatingTexts.push(new FloatingText("+600 (+1.5s) ★", '#ffd600', 20));
                for (let k = 0; k < 25; k++) {
                    particles.push(new Particle(currentTomato.x + 30, currentTomato.y - 20, '#ffea00', 1));
                }
            } else {
                floatingTexts.push(new FloatingText("+300 ★", '#00e676', 20));
                for (let k = 0; k < 18; k++) {
                    particles.push(new Particle(currentTomato.x + 30, currentTomato.y - 20, '#1b5e20', 1));
                }
            }

            triggerSuccessAnimation(() => {
                spawnNextTomato();
            });
        } else {
            playSound('pull');
            for (let k = 0; k < 4; k++) {
                particles.push(new Particle(currentTomato.x + 20, currentTomato.y - 20, '#ffffff', 1));
            }
        }
    }

    // 💡 倒數處理
    function handleCountdown(delta) {
        if (!isCountingDown) return;

        countdownTimer += delta;

        const steps = [
            { text: '3', color: '#ffffff', sound: 'beep' },
            { text: '2', color: '#ffea00', sound: 'beep' },
            { text: '1', color: '#ff9800', sound: 'beep' },
            { text: 'START!', color: '#ff1744', sound: 'beep_final' }
        ];

        const stepInterval = 0.85;
        const currentIdx = Math.floor(countdownTimer / stepInterval);

        if (currentIdx !== countdownStep && currentIdx < steps.length) {
            countdownStep = currentIdx;
            playSound(steps[countdownStep].sound);
        }

        if (currentIdx >= steps.length) {
            isCountingDown = false;
            gameStarted = true;
            return;
        }

        ctx.save();
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.lineWidth = 2;
        const lineSpacing = 10;

        for (let x = -GAME_HEIGHT; x < GAME_WIDTH + GAME_HEIGHT; x += lineSpacing) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x + GAME_HEIGHT, GAME_HEIGHT);
            ctx.stroke();
        }

        for (let x = GAME_WIDTH + GAME_HEIGHT; x > -GAME_HEIGHT; x -= lineSpacing * 1.5) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x - GAME_HEIGHT, GAME_HEIGHT);
            ctx.stroke();
        }

        const step = steps[countdownStep] || steps[0];
        const progressInStep = (countdownTimer % stepInterval) / stepInterval;
        const scale = 1.0 + Math.sin(progressInStep * Math.PI) * 0.35; 

        ctx.translate(GAME_WIDTH / 2, GAME_HEIGHT / 2);
        ctx.scale(scale, scale);
        drawPixelText(step.text, 0, 0, step.color, 76, 'center');
        ctx.restore();
    }

    function updateGame(delta) {
        if (!gameStarted || gameOver || isCountingDown) return;

        timeLeft -= delta;
        if (timeLeft <= 0) {
            timeLeft = 0;
            gameOver = true;
            gameOverLockTime = 0.5; // 短暫緩衝避免誤觸
        }

        if (isFever) {
            feverTimer -= delta;
            if (feverTimer <= 0) {
                isFever = false;
                feverTimer = 0;
                feverCooldown = 1.0;
                currentTomato = null;
                comboCount = 0;
            }
        } else if (feverCooldown > 0) {
            feverCooldown -= delta;
            if (feverCooldown <= 0) {
                feverCooldown = 0;
                spawnNextTomato();
            }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            if (particles[i].life <= 0) particles.splice(i, 1);
        }

        for (let i = bottomEmitters.length - 1; i >= 0; i--) {
            bottomEmitters[i].update();
            if (bottomEmitters[i].life <= 0) bottomEmitters.splice(i, 1);
        }

        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            floatingTexts[i].update();
            if (floatingTexts[i].opacity <= 0) floatingTexts.splice(i, 1);
        }

        updateFilmGrain();
    }

    function drawPixelWarningIcon(cx, cy) {
        ctx.save();
        ctx.globalAlpha = 1.0;
        ctx.imageSmoothingEnabled = false;
        
        ctx.fillStyle = '#ffea00';
        ctx.beginPath();
        ctx.moveTo(cx, cy - 34);
        ctx.lineTo(cx + 36, cy + 26);
        ctx.lineTo(cx - 36, cy + 26);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 5;
        ctx.stroke();

        ctx.fillStyle = '#000000';
        ctx.fillRect(cx - 4, cy - 15, 8, 20);
        ctx.fillRect(cx - 4, cy + 10, 8, 8);

        ctx.restore();
    }

    function drawUI() {

        // 1. 積分框 (SCORE)
        drawPixelBox(20, 20, 240, 50, '#111111', '#ffffff', '#000000', 4);
        drawPixelText(`SCORE:${score}`, 140, 47, '#ffffff', 14, 'center');

        // 2. 時間倒數框 (TIME)
        const timeColor = timeLeft <= 5.0 ? '#ff1744' : '#ffeb3b';
        drawPixelBox(GAME_WIDTH - 260, 20, 240, 50, '#111111', timeColor, '#000000', 4);
        drawPixelText(`TIME:${timeLeft.toFixed(1)}s`, GAME_WIDTH - 140, 47, timeColor, 14, 'center');

        // 3. Fever Mode 進度條槽
        const fBarX = 280;
        const fBarY = 32;
        const fBarW = 240;
        const fBarH = 22;
        const radius = 11;

        let fBorderColor = '#555555';
        let fFillRatio = 0;

        if (isFever) {
            const flashTick = Math.floor(Date.now() / 60) % 3;
            fBorderColor = flashTick === 0 ? '#ffea00' : (flashTick === 1 ? '#ff1744' : '#ffffff');
            fFillRatio = Math.max(0, feverTimer / MAX_FEVER_TIME);
        } else {
            fBorderColor = comboCount > 0 ? '#ff1744' : '#555555';
            fFillRatio = Math.min(1.0, comboCount / 8.0);
        }

        function drawRoundedBarPath(x, y, w, h, r) {
            ctx.beginPath();
            ctx.arc(x + r, y + r, r, Math.PI * 0.5, Math.PI * 1.5);
            ctx.lineTo(x + w - r, y);
            ctx.arc(x + w - r, y + r, r, Math.PI * 1.5, Math.PI * 0.5);
            ctx.lineTo(x + r, y + h);
            ctx.closePath();
        }

        ctx.save();
        ctx.fillStyle = '#000000';
        drawRoundedBarPath(fBarX + 3, fBarY + 3, fBarW, fBarH, radius);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        drawRoundedBarPath(fBarX, fBarY, fBarW, fBarH, radius);
        ctx.fill();

        ctx.strokeStyle = fBorderColor;
        ctx.lineWidth = 3;
        ctx.stroke();

        if (fFillRatio > 0) {
            ctx.save();
            drawRoundedBarPath(fBarX, fBarY, fBarW, fBarH, radius);
            ctx.clip();

            const fillW = fBarW * fFillRatio;
            const cycle = (Date.now() % 3000) / 3000;
            const shift = (Math.sin(cycle * Math.PI * 2) + 1) / 2;

            const grad = ctx.createLinearGradient(fBarX, fBarY, fBarX + fBarW, fBarY);
            if (shift < 0.5) {
                grad.addColorStop(0, '#ff1744');
                grad.addColorStop(0.5 + shift, '#ffea00');
                grad.addColorStop(1, '#ff1744');
            } else {
                grad.addColorStop(0, '#ffea00');
                grad.addColorStop(shift - 0.5, '#ff1744');
                grad.addColorStop(1, '#ffea00');
            }

            ctx.fillStyle = grad;
            ctx.fillRect(fBarX, fBarY, fillW, fBarH);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.fillRect(fBarX, fBarY, fillW, 3);
            ctx.restore();
        }

        drawClassicPixelTomato(fBarX + fBarW / 2, fBarY + fBarH / 2, 'normal', 55);
        ctx.restore();

        if (isFever) {
            drawPixelText("🔥BREAK THE RULES!!🔥", GAME_WIDTH / 2, fBarY - 14, '#ffea00', 12, 'center');
        }

        // 4. 捨棄按鈕 (Discard Button)
        if (!gameOver) {
            drawPixelBox(discardBtn.x, discardBtn.y, discardBtn.w, discardBtn.h, '#881337', '#ff1744', '#000000', 5);
            drawPixelWarningIcon(discardBtn.x + discardBtn.w / 2, discardBtn.y + discardBtn.h / 2);
        }

        for (let p of particles) p.draw();
        for (let b of bottomEmitters) b.draw();
        for (let ft of floatingTexts) ft.draw();

        // 🎮 遊戲結束結算畫面 (完全對齊 gao_game / candy_game)
        if (gameOver) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.90)';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            drawPixelBox(100, 70, 600, 460, '#111111', '#ff1744', '#000000', 6);
            drawPixelText('TIME UP!', GAME_WIDTH / 2, 130, '#ff1744', 28, 'center');
            drawPixelText(`FINAL SCORE: ${score}`, GAME_WIDTH / 2, 190, '#ffeb3b', 16, 'center');

            if (gameOverLockTime > 0) {
                drawPixelText(`PLEASE WAIT...`, GAME_WIDTH / 2, 280, '#888888', 14, 'center');
            } else {
                // 1. CONTINUE? 按鈕
                drawPixelBox(180, 260, 440, 50, '#d50000', '#ffea00', '#000000', 4);
                drawPixelText('CONTINUE?', GAME_WIDTH / 2, 285, '#ffffff', 14, 'center');

                // 2. GONNA STOP? 按鈕
                drawPixelBox(180, 330, 440, 50, '#333333', '#ffffff', '#000000', 4);
                drawPixelText('GONNA STOP?', GAME_WIDTH / 2, 355, '#ff4081', 14, 'center');

                // 3. 按此觀看COLLAR《管理還管你》MV 按鈕
                const mvBtnX = 155;
                const mvBtnY = 430;
                const mvBtnW = 490;
                const mvBtnH = 70;
                drawPixelBox(mvBtnX, mvBtnY, mvBtnW, mvBtnH, '#ffffff', '#C1001B', '#000000', 4);
                
                drawPixelTomatoIcon(mvBtnX + 28, mvBtnY + mvBtnH / 2, 1.0);
                drawPixelText('按此觀看COLLAR《管理還管你》MV', GAME_WIDTH / 2, mvBtnY + mvBtnH / 2, '#ffffff', 21, 'center', true);
                drawPixelTomatoIcon(mvBtnX + mvBtnW - 28, mvBtnY + mvBtnH / 2, 1.0);
            }
        }
    }

    function resetGame() {
        score = 0;
        timeLeft = 20.0;
        gameOver = false;
        gameOverLockTime = 0;
        isFirstSpawn = true;
        isTransitioning = false;
        comboCount = 0;
        isFever = false;
        feverTimer = 0;
        feverCooldown = 0;
        screenShake = 0;
        particles = [];
        bottomEmitters = [];
        floatingTexts = [];

        // 💡 重新倒數
        gameStarted = false;
        isCountingDown = true;
        countdownStep = -1;
        countdownTimer = 0;

        spawnNextTomato();
    }

    spawnNextTomato();

    function renderFrame() {
        const now = Date.now();
        const delta = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;

        ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        drawSmoothImage(currentBgImg);

        if (gameStarted && !gameOver && !isCountingDown) {
            updateGame(delta);
            if (currentTomato && feverCooldown <= 0) currentTomato.draw();
        } else if (gameOver) {
            if (gameOverLockTime > 0) {
                gameOverLockTime = Math.max(0, gameOverLockTime - delta);
            }
        }

        drawUI();

        if (isCountingDown) {
            handleCountdown(delta);
        }

        drawFilmGrainOverlay();
    }

    setInterval(renderFrame, 1000 / 60);

    function handleTap(clientX, clientY) {
        initAudioContext();

        if (isCountingDown) return;

        const rect = canvas.getBoundingClientRect();
        const scaleX = GAME_WIDTH / rect.width;
        const scaleY = GAME_HEIGHT / rect.height;

        const clickX = (clientX - rect.left) * scaleX;
        const clickY = (clientY - rect.top) * scaleY;

        // 💡 結算點擊邏輯 (升級 GONNA STOP? 多重備援機制)
        if (gameOver && gameOverLockTime <= 0) {
            // 1. CONTINUE? 按鈕 (X: 180~620, Y: 260~310)
            if (clickX >= 180 && clickX <= 620 && clickY >= 260 && clickY <= 310) {
                resetGame();
                return;
            }
            // 2. GONNA STOP? 按鈕 (X: 180~620, Y: 330~380)
            if (clickX >= 180 && clickX <= 620 && clickY >= 330 && clickY <= 380) {
                try {
                    // 💡 第一優先：最外層視窗 F5 刷新
                    if (window.top && window.top !== window) {
                        window.top.location.reload();
                    } else {
                        window.location.reload();
                    }
                } catch (err) {
                    // 💡 第二備援：發送 postMessage 給父頁面
                    if (window.parent) {
                        window.parent.postMessage({ action: 'RELOAD_GAME' }, '*');
                    } else {
                        window.location.reload();
                    }
                }
                return;
            }
            // 3. COLLAR MV 按鈕 (X: 155~645, Y: 430~500)
            if (clickX >= 155 && clickX <= 645 && clickY >= 430 && clickY <= 500) {
                window.open('https://youtu.be/4DObQP77xAs?si=lQ__OsG39YGlsKWd', '_blank');
                return;
            }
            return;
        }

        if (clickX >= discardBtn.x && clickX <= discardBtn.x + discardBtn.w &&
            clickY >= discardBtn.y && clickY <= discardBtn.y + discardBtn.h) {
            handleDiscardClick();
        } else {
            handlePullClick();
        }
    }

    container.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        handleTap(e.clientX, e.clientY);
    });

})();
</script>
